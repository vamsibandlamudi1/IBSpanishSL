version: '3.8'

services:
  ib-spanish-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ib-spanish-app
    ports:
      - "3000:3000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-5}
    restart: unless-stopped
