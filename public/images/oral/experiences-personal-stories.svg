<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="675" rx="0" fill="url(#bgGrad)"/>
  
  <!-- Subtle Overlay Pattern -->
  <circle cx="1100" cy="80" r="300" fill="#ffffff" fill-opacity="0.05" />
  <circle cx="100" cy="600" r="250" fill="#ffffff" fill-opacity="0.05" />

  <!-- Top Badge Header -->
  <rect x="40" y="35" width="400" height="42" rx="21" fill="#ffffff" fill-opacity="0.2" />
  <text x="60" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">
    EXPERIENCES / EXPERIENCIAS
  </text>

  <!-- Title & Sub-badge -->
  <text x="40" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#ffffff">
    Personal Stories & Heritage
  </text>

  <!-- Central Graphic Display Card -->
  <g filter="url(#shadow)">
    <rect x="40" y="160" width="1120" height="380" rx="24" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Main Big Display Emoji/Symbol Array -->
    <g transform="translate(80, 200)">
      
        <g transform="translate(0, 0)">
          <rect width="210" height="210" rx="30" fill="#854d0e" fill-opacity="0.08" stroke="#854d0e" stroke-opacity="0.2" stroke-width="2"/>
          <text x="105" y="135" font-size="96" text-anchor="middle" dominant-baseline="central">📷</text>
        </g>
      
        <g transform="translate(250, 0)">
          <rect width="210" height="210" rx="30" fill="#854d0e" fill-opacity="0.08" stroke="#854d0e" stroke-opacity="0.2" stroke-width="2"/>
          <text x="105" y="135" font-size="96" text-anchor="middle" dominant-baseline="central">👵</text>
        </g>
      
        <g transform="translate(500, 0)">
          <rect width="210" height="210" rx="30" fill="#854d0e" fill-opacity="0.08" stroke="#854d0e" stroke-opacity="0.2" stroke-width="2"/>
          <text x="105" y="135" font-size="96" text-anchor="middle" dominant-baseline="central">🧑</text>
        </g>
      
        <g transform="translate(750, 0)">
          <rect width="210" height="210" rx="30" fill="#854d0e" fill-opacity="0.08" stroke="#854d0e" stroke-opacity="0.2" stroke-width="2"/>
          <text x="105" y="135" font-size="96" text-anchor="middle" dominant-baseline="central">📖</text>
        </g>
      
    </g>
  </g>

  <!-- Prompt Exact Scene Description Bar -->
  <rect x="40" y="565" width="1120" height="75" rx="16" fill="#0f172a" fill-opacity="0.85" />
  
  <text x="70" y="595" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#c084fc" letter-spacing="1">
    EXACT STIMULUS SCENE:
  </text>
  <text x="70" y="622" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#f8fafc">
    Elderly person showing photo album to teenager, smiling together
  </text>
</svg>