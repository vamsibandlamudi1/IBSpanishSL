<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  
      <!-- Supermarket Aisle -->
      <rect width="1200" height="675" fill="#0f172a"/>
      <!-- Shelves -->
      <rect x="100" y="140" width="1000" height="20" fill="#94a3b8"/>
      <rect x="100" y="320" width="1000" height="20" fill="#94a3b8"/>
      <rect x="100" y="500" width="1000" height="20" fill="#94a3b8"/>

      <!-- Shelf 1 Items (Bananas from Ecuador, Oranges from Spain) -->
      <g transform="translate(180, 50)">
        <text x="0" y="80" font-size="65">🍌🍌🍌</text>
        <rect x="10" y="95" width="120" height="30" rx="6" fill="#eab308"/>
        <text x="70" y="115" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">🇪🇨 ECUADOR</text>

        <text x="350" y="80" font-size="65">🍊🍊🍊</text>
        <rect x="360" y="95" width="120" height="30" rx="6" fill="#f97316"/>
        <text x="420" y="115" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">🇪🇸 ESPAÑA</text>

        <text x="680" y="80" font-size="65">🥑🥑🥑</text>
        <rect x="690" y="95" width="120" height="30" rx="6" fill="#15803d"/>
        <text x="750" y="115" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">🇲🇽 MÉXICO</text>
      </g>

      <!-- Shelf 2 Items (Pineapples from Costa Rica, Coffee from Colombia) -->
      <g transform="translate(180, 230)">
        <text x="0" y="80" font-size="65">🍍🍍🍍</text>
        <rect x="10" y="95" width="140" height="30" rx="6" fill="#0284c7"/>
        <text x="80" y="115" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">🇨🇷 COSTA RICA</text>

        <text x="350" y="80" font-size="65">☕️☕️☕️</text>
        <rect x="360" y="95" width="130" height="30" rx="6" fill="#78350f"/>
        <text x="425" y="115" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">🇨🇴 COLOMBIA</text>

        <text x="680" y="80" font-size="65">🍇🍇🍇</text>
        <rect x="690" y="95" width="120" height="30" rx="6" fill="#7e22ce"/>
        <text x="750" y="115" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">🇨🇱 CHILE</text>
      </g>
    

  <!-- Header Overlay Tag -->
  <rect x="210" y="25" width="440" height="42" rx="21" fill="#0f172a" opacity="0.9" stroke="#a855f7" stroke-width="1.5"/>
  <text x="230" y="52" font-family="sans-serif" font-size="15" font-weight="700" fill="#c084fc" letter-spacing="1.5">SHARING THE PLANET</text>

  <!-- Card Title Header -->
  <rect x="40" y="90" width="550" height="50" rx="12" fill="#0f172a" opacity="0.85"/>
  <text x="60" y="125" font-family="sans-serif" font-size="26" font-weight="800" fill="#ffffff">Global Supermarket / Mercado Global</text>

  <!-- Footer Scene Description Overlay -->
  <rect x="40" y="575" width="1120" height="70" rx="16" fill="#020617" fill-opacity="0.95" stroke="#334155" stroke-width="1.5" />
  <text x="70" y="602" font-family="sans-serif" font-size="13" font-weight="800" fill="#c084fc" letter-spacing="1.5">EXACT STIMULUS SCENE:</text>
  <text x="70" y="628" font-family="sans-serif" font-size="17" font-weight="600" fill="#f8fafc">A supermarket shelf stocked with fruit labeled from many different countries.</text>
</svg>