<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  
      <!-- Store Aisle Shelf Background -->
      <rect width="1200" height="675" fill="#1e1b4b"/>
      <rect x="100" y="440" width="1000" height="25" fill="#475569"/>

      <!-- Single use plastic bottle (Crossed out) -->
      <g transform="translate(220, 200)">
        <rect x="0" y="0" width="200" height="220" rx="20" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="4"/>
        <text x="100" y="110" font-size="90" text-anchor="middle">🥤</text>
        <text x="100" y="180" font-size="45" text-anchor="middle">❌</text>
        <text x="100" y="210" font-size="14" font-weight="bold" fill="#ef4444" text-anchor="middle">DISPOSABLE</text>
      </g>

      <!-- Reusable Stainless Steel Bottle (Chosen / Checked) -->
      <g transform="translate(740, 180)">
        <rect x="0" y="0" width="220" height="240" rx="20" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="4"/>
        <text x="110" y="110" font-size="90" text-anchor="middle">🚰</text>
        <text x="110" y="180" font-size="45" text-anchor="middle">✅</text>
        <text x="110" y="220" font-size="14" font-weight="bold" fill="#22c55e" text-anchor="middle">REUSABLE BOTTLE</text>
      </g>

      <!-- Teenager Hand choosing reusable bottle -->
      <g transform="translate(480, 260)">
        <text x="80" y="70" font-size="80">🙋‍♂️</text>
        <path d="M 60 100 L -120 40" stroke="#fde047" stroke-width="24" stroke-linecap="round"/>
      </g>
    

  <!-- Header Overlay Tag -->
  <rect x="210" y="25" width="440" height="42" rx="21" fill="#0f172a" opacity="0.9" stroke="#a855f7" stroke-width="1.5"/>
  <text x="230" y="52" font-family="sans-serif" font-size="15" font-weight="700" fill="#c084fc" letter-spacing="1.5">SHARING THE PLANET</text>

  <!-- Card Title Header -->
  <rect x="40" y="90" width="550" height="50" rx="12" fill="#0f172a" opacity="0.85"/>
  <text x="60" y="125" font-family="sans-serif" font-size="26" font-weight="800" fill="#ffffff">Ethical Consumption / Consumo Ético</text>

  <!-- Footer Scene Description Overlay -->
  <rect x="40" y="575" width="1120" height="70" rx="16" fill="#020617" fill-opacity="0.95" stroke="#334155" stroke-width="1.5" />
  <text x="70" y="602" font-family="sans-serif" font-size="13" font-weight="800" fill="#c084fc" letter-spacing="1.5">EXACT STIMULUS SCENE:</text>
  <text x="70" y="628" font-family="sans-serif" font-size="17" font-weight="600" fill="#f8fafc">A teenager choosing a reusable water bottle over a single-use plastic one.</text>
</svg>