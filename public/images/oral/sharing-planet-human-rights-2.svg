<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  
      <!-- City Square Background -->
      <rect width="1200" height="675" fill="#1e1b4b"/>
      <!-- Buildings -->
      <rect x="100" y="120" width="200" height="300" fill="#312e81"/>
      <rect x="350" y="80" width="250" height="340" fill="#3730a3"/>
      <rect x="650" y="140" width="220" height="280" fill="#312e81"/>
      <rect x="900" y="100" width="200" height="320" fill="#1e1b4b"/>
      <rect x="0" y="420" width="1200" height="255" fill="#475569"/>

      <!-- Crowd silhouettes with Signs -->
      <g transform="translate(150, 240)">
        <!-- Sign 1 -->
        <rect x="20" y="20" width="160" height="100" rx="8" fill="#fef08a" stroke="#eab308" stroke-width="4"/>
        <text x="100" y="75" font-size="22" font-weight="bold" fill="#854d0e" text-anchor="middle">EQUALIY ✊</text>
        <rect x="92" y="120" width="16" height="120" fill="#78350f"/>
        <!-- Person -->
        <circle cx="100" cy="220" r="35" fill="#fda4af"/>
      </g>

      <g transform="translate(480, 200)">
        <!-- Sign 2 -->
        <rect x="20" y="20" width="180" height="100" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="4"/>
        <text x="110" y="75" font-size="22" font-weight="bold" fill="#14532d" text-anchor="middle">RIGHTS FOR ALL</text>
        <rect x="102" y="120" width="16" height="140" fill="#78350f"/>
        <!-- Person -->
        <circle cx="110" cy="230" r="35" fill="#fed7aa"/>
      </g>

      <g transform="translate(820, 230)">
        <!-- Sign 3 -->
        <rect x="20" y="20" width="160" height="100" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="4"/>
        <text x="100" y="75" font-size="22" font-weight="bold" fill="#312e81" text-anchor="middle">JUSTICIA 📢</text>
        <rect x="92" y="120" width="16" height="130" fill="#78350f"/>
        <!-- Person -->
        <circle cx="100" cy="220" r="35" fill="#fbcfe8"/>
      </g>
    

  <!-- Header Overlay Tag -->
  <rect x="210" y="25" width="440" height="42" rx="21" fill="#0f172a" opacity="0.9" stroke="#a855f7" stroke-width="1.5"/>
  <text x="230" y="52" font-family="sans-serif" font-size="15" font-weight="700" fill="#c084fc" letter-spacing="1.5">SHARING THE PLANET</text>

  <!-- Card Title Header -->
  <rect x="40" y="90" width="550" height="50" rx="12" fill="#0f172a" opacity="0.85"/>
  <text x="60" y="125" font-family="sans-serif" font-size="26" font-weight="800" fill="#ffffff">Human Rights March / Marcha por los Derechos</text>

  <!-- Footer Scene Description Overlay -->
  <rect x="40" y="575" width="1120" height="70" rx="16" fill="#020617" fill-opacity="0.95" stroke="#334155" stroke-width="1.5" />
  <text x="70" y="602" font-family="sans-serif" font-size="13" font-weight="800" fill="#c084fc" letter-spacing="1.5">EXACT STIMULUS SCENE:</text>
  <text x="70" y="628" font-family="sans-serif" font-size="17" font-weight="600" fill="#f8fafc">A crowd holding handmade signs at a peaceful march in a city square.</text>
</svg>