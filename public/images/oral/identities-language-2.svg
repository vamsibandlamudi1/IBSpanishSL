<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  
      <!-- Classroom Wall -->
      <rect width="1200" height="675" fill="#1e293b"/>
      <!-- World Map Board -->
      <rect x="150" y="80" width="900" height="400" rx="16" fill="#0284c7" stroke="#38bdf8" stroke-width="6"/>
      <text x="600" y="260" font-size="120" opacity="0.3" text-anchor="middle">🗺️</text>

      <!-- Pinned Flags -->
      <g transform="translate(240, 160)">
        <text x="0" y="0" font-size="50">🇲🇽</text>
        <text x="150" y="80" font-size="50">🇪🇸</text>
        <text x="320" y="-20" font-size="50">🇨🇴</text>
        <text x="480" y="90" font-size="50">🇦🇷</text>
        <text x="620" y="30" font-size="50">🇵🇪</text>
      </g>

      <!-- Teacher pointing at map -->
      <g transform="translate(100, 280)">
        <text x="0" y="100" font-size="100">👩‍🏫</text>
        <line x1="80" y1="50" x2="240" y2="-50" stroke="#fde047" stroke-width="8" stroke-linecap="round"/>
      </g>
    

  <!-- Header Overlay Tag -->
  <rect x="210" y="25" width="440" height="42" rx="21" fill="#0f172a" opacity="0.9" stroke="#a855f7" stroke-width="1.5"/>
  <text x="230" y="52" font-family="sans-serif" font-size="15" font-weight="700" fill="#c084fc" letter-spacing="1.5">IDENTITIES</text>

  <!-- Card Title Header -->
  <rect x="40" y="90" width="550" height="50" rx="12" fill="#0f172a" opacity="0.85"/>
  <text x="60" y="125" font-family="sans-serif" font-size="26" font-weight="800" fill="#ffffff">Multicultural Class / Diversidad Cultural</text>

  <!-- Footer Scene Description Overlay -->
  <rect x="40" y="575" width="1120" height="70" rx="16" fill="#020617" fill-opacity="0.95" stroke="#334155" stroke-width="1.5" />
  <text x="70" y="602" font-family="sans-serif" font-size="13" font-weight="800" fill="#c084fc" letter-spacing="1.5">EXACT STIMULUS SCENE:</text>
  <text x="70" y="628" font-family="sans-serif" font-size="17" font-weight="600" fill="#f8fafc">Classroom world map pinned with flags representing students.</text>
</svg>