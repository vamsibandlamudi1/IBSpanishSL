<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  
      <!-- Suburban House & Driveway -->
      <rect width="1200" height="675" fill="#0f172a"/>
      <!-- House -->
      <polygon points="200,200 400,80 600,200" fill="#b91c1c"/>
      <rect x="230" y="200" width="340" height="240" fill="#fef3c7"/>
      <rect x="360" y="300" width="80" height="140" fill="#78350f"/>

      <!-- Large Moving Truck -->
      <g transform="translate(620, 180)">
        <rect x="0" y="0" width="450" height="220" rx="12" fill="#2563eb"/>
        <text x="225" y="100" font-size="30" font-weight="bold" fill="#fff" text-anchor="middle">🚚 INTERNATIONAL MOVERS</text>
        <circle cx="80" cy="240" r="40" fill="#334155"/>
        <circle cx="370" cy="240" r="40" fill="#334155"/>
      </g>

      <!-- Cardboard Moving Boxes with Bilingual Labels -->
      <g transform="translate(250, 440)">
        <!-- Box 1 -->
        <rect x="0" y="0" width="140" height="110" rx="8" fill="#d97706"/>
        <text x="70" y="60" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">BOOKS / LIBROS</text>

        <!-- Box 2 -->
        <rect x="180" y="-20" width="150" height="130" rx="8" fill="#d97706"/>
        <text x="255" y="50" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">CLOTHES / ROPA</text>
      </g>
    

  <!-- Header Overlay Tag -->
  <rect x="210" y="25" width="440" height="42" rx="21" fill="#0f172a" opacity="0.9" stroke="#a855f7" stroke-width="1.5"/>
  <text x="230" y="52" font-family="sans-serif" font-size="15" font-weight="700" fill="#c084fc" letter-spacing="1.5">EXPERIENCES</text>

  <!-- Card Title Header -->
  <rect x="40" y="90" width="550" height="50" rx="12" fill="#0f172a" opacity="0.85"/>
  <text x="60" y="125" font-family="sans-serif" font-size="26" font-weight="800" fill="#ffffff">Moving Day / Mudanza e Idiomas</text>

  <!-- Footer Scene Description Overlay -->
  <rect x="40" y="575" width="1120" height="70" rx="16" fill="#020617" fill-opacity="0.95" stroke="#334155" stroke-width="1.5" />
  <text x="70" y="602" font-family="sans-serif" font-size="13" font-weight="800" fill="#c084fc" letter-spacing="1.5">EXACT STIMULUS SCENE:</text>
  <text x="70" y="628" font-family="sans-serif" font-size="17" font-weight="600" fill="#f8fafc">A moving truck parked outside a house with boxes labeled in two languages.</text>
</svg>