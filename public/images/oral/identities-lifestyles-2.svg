<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  
      <!-- Cafeteria Counter -->
      <rect width="1200" height="675" fill="#0f172a"/>
      <rect x="80" y="360" width="1040" height="200" rx="12" fill="#334155"/>

      <!-- Salad Option -->
      <g transform="translate(200, 200)">
        <rect x="0" y="0" width="220" height="150" rx="16" fill="#15803d" fill-opacity="0.3" stroke="#22c55e" stroke-width="4"/>
        <text x="110" y="90" font-size="80" text-anchor="middle">🥗</text>
        <text x="110" y="130" font-size="16" font-weight="bold" fill="#4ade80" text-anchor="middle">FRESH SALAD</text>
      </g>

      <!-- Fast Food Option -->
      <g transform="translate(780, 200)">
        <rect x="0" y="0" width="220" height="150" rx="16" fill="#b91c1c" fill-opacity="0.3" stroke="#ef4444" stroke-width="4"/>
        <text x="110" y="90" font-size="80" text-anchor="middle">🍔</text>
        <text x="110" y="130" font-size="16" font-weight="bold" fill="#fca5a5" text-anchor="middle">FAST FOOD</text>
      </g>

      <!-- Student with Tray in Center -->
      <g transform="translate(520, 220)">
        <text x="80" y="60" font-size="80" text-anchor="middle">🤔</text>
        <rect x="10" y="120" width="140" height="20" rx="4" fill="#94a3b8"/>
        <text x="80" y="170" font-size="40" text-anchor="middle">🎮 🎒</text>
      </g>
    

  <!-- Header Overlay Tag -->
  <rect x="210" y="25" width="440" height="42" rx="21" fill="#0f172a" opacity="0.9" stroke="#a855f7" stroke-width="1.5"/>
  <text x="230" y="52" font-family="sans-serif" font-size="15" font-weight="700" fill="#c084fc" letter-spacing="1.5">IDENTITIES</text>

  <!-- Card Title Header -->
  <rect x="40" y="90" width="550" height="50" rx="12" fill="#0f172a" opacity="0.85"/>
  <text x="60" y="125" font-family="sans-serif" font-size="26" font-weight="800" fill="#ffffff">Cafeteria Choices / Decisiones Diarias</text>

  <!-- Footer Scene Description Overlay -->
  <rect x="40" y="575" width="1120" height="70" rx="16" fill="#020617" fill-opacity="0.95" stroke="#334155" stroke-width="1.5" />
  <text x="70" y="602" font-family="sans-serif" font-size="13" font-weight="800" fill="#c084fc" letter-spacing="1.5">EXACT STIMULUS SCENE:</text>
  <text x="70" y="628" font-family="sans-serif" font-size="17" font-weight="600" fill="#f8fafc">A student choosing between a salad and fast food at a school cafeteria.</text>
</svg>