      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  
      <!-- Place of Worship Interior -->
      <rect width="1200" height="675" fill="#090d16"/>
      
      <!-- Stained Glass Window with Colorful Light Beam -->
