<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  
      <!-- Night Sky & Woods -->
      <rect width="1200" height="675" fill="#020617"/>
      <!-- Stars & Moon -->
      <text x="950" y="100" font-size="60">🌙 ⭐️ ✨</text>
      <!-- Trees -->
      <text x="100" y="280" font-size="100">🌲</text>
      <text x="250" y="260" font-size="120">🌲</text>
      <text x="800" y="270" font-size="110">🌲</text>

      <!-- Campfire in Center -->
      <g transform="translate(530, 360)">
        <text x="0" y="60" font-size="110" text-anchor="middle">🔥</text>
        <rect x="-60" y="80" width="120" height="20" rx="6" fill="#78350f"/>
      </g>

      <!-- Grandparent telling story -->
      <g transform="translate(260, 310)">
        <circle cx="60" cy="50" r="40" fill="#fcd34d"/>
        <!-- Glasses/Hair -->
        <text x="60" y="55" font-size="45" text-anchor="middle">👴</text>
        <rect x="20" y="90" width="80" height="100" rx="16" fill="#0369a1"/>
        <text x="120" y="40" font-size="45">💬 "Érase una vez..."</text>
      </g>

      <!-- Grandchildren listening -->
      <g transform="translate(800, 330)">
        <text x="0" y="60" font-size="60">👧</text>
        <text x="70" y="60" font-size="60">👦</text>
      </g>
    

  <!-- Header Overlay Tag -->
  <rect x="210" y="25" width="440" height="42" rx="21" fill="#0f172a" opacity="0.9" stroke="#a855f7" stroke-width="1.5"/>
  <text x="230" y="52" font-family="sans-serif" font-size="15" font-weight="700" fill="#c084fc" letter-spacing="1.5">EXPERIENCES</text>

  <!-- Card Title Header -->
  <rect x="40" y="90" width="550" height="50" rx="12" fill="#0f172a" opacity="0.85"/>
  <text x="60" y="125" font-family="sans-serif" font-size="26" font-weight="800" fill="#ffffff">Campfire Stories / Historias de Fogata</text>

  <!-- Footer Scene Description Overlay -->
  <rect x="40" y="575" width="1120" height="70" rx="16" fill="#020617" fill-opacity="0.95" stroke="#334155" stroke-width="1.5" />
  <text x="70" y="602" font-family="sans-serif" font-size="13" font-weight="800" fill="#c084fc" letter-spacing="1.5">EXACT STIMULUS SCENE:</text>
  <text x="70" y="628" font-family="sans-serif" font-size="17" font-weight="600" fill="#f8fafc">An elderly grandparent telling a story to grandchildren around a campfire.</text>
</svg>